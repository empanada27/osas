name: Build Android APK

on:
  push:
    branches: [ main ] # Cambia a 'master' si esa es tu rama principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fuente 🛎️
        uses: actions/checkout@v4

      - name: Configurar Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependencias Web 🔧
        run: npm ci

      - name: Compilar Frontend (Vite) 🚀
        run: npm run build

      - name: Sincronizar Plataforma Nativa (Capacitor) 📱
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android

      - name: Dar Permisos de Ejecución a Gradle 🔑
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle (Debug) 🛠️
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK Compilado como Artefacto 📦
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
