name: Build Android APK
on:
  workflow_dispatch: # Esto te permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js (Entorno Web)
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 3. Configurar Java (Entorno Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. Instalar librerías del proyecto
      run: npm install

    - name: 5. Compilar el diseño de Figma (Vite)
      run: npm run build

    - name: 6. Instalar y sincronizar Android (Capacitor)
      run: |
        npx cap add android || true
        npx cap sync android

    - name: 7. Fabricar el APK (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 8. Guardar el APK para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Mi-App-Figma-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
